name: Recovery guard

# The math recovery is this fork's reason to exist, and two things about it are invisible
# in an ordinary test run: whether the tests would notice if the code changed underneath
# them, and whether the parts of it nobody exercises are growing. Both fail the run when
# they regress, so the answer is a red mark on the repository rather than a number somebody
# has to go and look up.
#
# Both jobs install what the recovery's real-boundary tests need -- node, the extractor's
# dependencies, and a Chromium -- because a suite that cannot run those measures something
# other than this fork's code.

on:
  schedule:
    # Nightly. The question these jobs answer changes whenever the recovery or its tests
    # do, which is often enough that a week of silence is a week of not knowing.
    - cron: '0 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'h/services/normalization.py'
      - 'h/services/pdf_math.py'
      - 'h/scripts/html-normalize/**'
      - 'tests/unit/h/services/**'
      - 'bin/check_recovery_coverage.py'
      - 'bin/report_mutants.py'
      - '.github/workflows/recovery-guard.yml'

env:
  # What tox sets for its `tests` env. mutmut runs pytest itself, outside tox, so its
  # runner needs them from here.
  DATABASE_URL: postgresql://postgres@localhost:5432/h_tests
  ELASTICSEARCH_URL: http://localhost:9200
  ELASTICSEARCH_INDEX: hypothesis-tests
  AUTHORITY: example.com
  JWT_SIGNING_KEY: dev_jwt_signing_key
  H_MATH_NORMALIZE_TIMEOUT: '30'
  H_MATH_NORMALIZE_SHUTDOWN_GRACE: '5'

jobs:
  Coverage:
    # The repository's own coverage config demands 100%; the test command overrides it with
    # `--cov-fail-under=0`. Everything except the recovery meets it, so this job holds the
    # two recovery modules to what they measure today and fails if either slips.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.10-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: hypothesis/elasticsearch:elasticsearch7.10
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install what the recovery's real boundaries need
        run: |
          # Not corepack: the root package.json declares yarn as its packageManager, so
          # corepack refuses to run pnpm here. The extractor's own tree is a pnpm one.
          npx --yes pnpm@10.14.0 install --dir h/scripts/html-normalize --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright" npx --yes playwright@1.61.1 install chromium
          echo "H_CHROMIUM_PATH=$(find "$PWD/.playwright" -name chrome -type f | head -1)" >> "$GITHUB_ENV"
      - run: python -m pip install 'tox<4'
      - name: Measure the recovery's coverage
        # pipefail, or a failing suite is invisible: without it the step reports tee's
        # status and the floor check scores a partial measurement.
        shell: bash
        run: |
          set -o pipefail
          tox -e tests -- --cov --cov-report=term --cov-fail-under=0 \
            --numprocesses logical --dist loadgroup tests/unit/ | tee coverage.txt
      - name: Hold each recovery module to its floor
        run: python bin/check_recovery_coverage.py coverage.txt

  Mutants:
    # Does the suite notice when the recovery changes? mutmut edits the source one small
    # change at a time and reruns the tests that own it; anything that survives is a change
    # to the recovery no test objects to.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:15.10-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        image: hypothesis/elasticsearch:elasticsearch7.10
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install what the recovery's real boundaries need
        run: |
          # Not corepack: the root package.json declares yarn as its packageManager, so
          # corepack refuses to run pnpm here. The extractor's own tree is a pnpm one.
          npx --yes pnpm@10.14.0 install --dir h/scripts/html-normalize --frozen-lockfile
          PLAYWRIGHT_BROWSERS_PATH="$PWD/.playwright" npx --yes playwright@1.61.1 install chromium
          echo "H_CHROMIUM_PATH=$(find "$PWD/.playwright" -name chrome -type f | head -1)" >> "$GITHUB_ENV"
      # mutmut 3 dropped --paths-to-mutate/--runner and configures through pyproject; 2.5 is
      # the CLI these steps are written against, checked against the tool not assumed.
      - run: python -m pip install 'tox<4' 'mutmut==2.5.1'
      - name: Prove the tests pass before mutating anything
        # This also builds .tox/tests, which `--notest` does not: the dependency install
        # lives in tox's commands_pre, so skipping it leaves an interpreter with no pytest
        # and a survey that dies on its baseline run.
        run: |
          tox -e tests -- -q --no-cov \
            tests/unit/h/services/normalization_test.py \
            tests/unit/h/services/pdf_math_test.py \
            tests/unit/h/services/recovery_paths_test.py
      - name: Survey the recovery for changes no test objects to
        # No `|| true`: a survey that cannot run is a failed job, not an empty result that
        # reads as clean.
        run: |
          mutmut run \
            --paths-to-mutate h/services/normalization.py,h/services/pdf_math.py \
            --runner ".tox/tests/bin/python -m pytest -x -q --no-cov tests/unit/h/services/normalization_test.py tests/unit/h/services/pdf_math_test.py tests/unit/h/services/recovery_paths_test.py" \
            --no-progress
          mutmut results > mutants.txt
      - name: Report what the survey found
        # Only when there is a survey to report; a crashed run has no results file, and
        # the failure to read about is in the step above.
        if: always() && hashFiles('mutants.txt') != ''
        run: python bin/report_mutants.py mutants.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Fail on survivors, and on a survey that tested nothing
        run: python bin/report_mutants.py mutants.txt --fail-on-survivors
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-survey
          path: mutants.txt
